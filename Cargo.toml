[workspace]
resolver = "2"
members = [
    "crates/contracts",
    "crates/core",
    "crates/modules/catalog",
    "crates/modules/inventory",
    "crates/modules/channel",
    "crates/modules/order",
    "crates/modules/user",
    "crates/modules/analytics",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Program1 Maintainers"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
