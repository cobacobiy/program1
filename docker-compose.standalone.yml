services:
  program1-app:
    image: ghcr.io/cobacobiy/program1:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: program1-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_PORT=8080
      - DATABASE_URL=sqlite:///app/data/program1.db?mode=rwc
    volumes:
      - program1_data:/app/data
    ports:
      - "6090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/store/info"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default

volumes:
  program1_data:
    name: program1_data

networks:
  default:
    name: program1_net
    external: true
