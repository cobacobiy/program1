name: Server Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, 226node2]
    steps:
      - name: Inspect Docker & App Status on Server
        shell: bash
        run: |
          echo "=== 1. DOCKER CONTAINERS (ALL) ==="
          docker ps -a --filter "name=program1"
          
          echo "=== 2. CONTAINER INSPECT (STATE & HEALTH) ==="
          docker inspect program1-app --format 'Status: {{.State.Status}}, ExitCode: {{.State.ExitCode}}, Error: {{.State.Error}}, Restarting: {{.State.Restarting}}, Health: {{json .State.Health}}' || true
          
          echo "=== 3. CONTAINER LOGS (LAST 100 LINES) ==="
          docker logs --tail 100 program1-app || true
          
          echo "=== 4. LISTENING PORTS (6090 / 8080) ==="
          ss -tlpn | grep -E '6090|8080' || true
          
          echo "=== 5. CURL LOCALHOST:6090/health ==="
          curl -ivs --max-time 5 http://localhost:6090/health || true

          echo "=== 6. AUTO-RECOVERY (DOCKER COMPOSE UP) IF DOWN ==="
          if ! curl -fsS --max-time 3 http://localhost:6090/health >/dev/null 2>&1; then
            echo "Health check failed! Attempting to restart container..."
            docker compose up -d --force-recreate
            sleep 4
            docker ps -a --filter "name=program1"
            docker logs --tail 50 program1-app || true
            curl -ivs --max-time 5 http://localhost:6090/health || true
          else
            echo "App is healthy and responding on port 6090!"
          fi
