name: Server Diagnostics (Linux Server 226)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, 226node2]
    steps:
      - name: Inspect Docker & App Status on Server 226
        shell: bash
        run: |
          echo "=== 1. DOCKER CONTAINERS (ALL) ==="
          docker ps -a --filter "name=program1"
          
          echo "=== 2. CONTAINER INSPECT (STATE & HEALTH) ==="
          docker inspect program1-app --format 'Status: {{.State.Status}}, ExitCode: {{.State.ExitCode}}, Error: {{.State.Error}}, Health: {{json .State.Health}}' || true
          
          echo "=== 3. CONTAINER LOGS (LAST 150 LINES) ==="
          docker logs --tail 150 program1-app || true
          
          echo "=== 4. LISTENING PORTS (6090 / 8080) ==="
          ss -tlpn | grep -E '6090|8080' || netstat -tlpn 2>/dev/null | grep -E '6090|8080' || true
          
          echo "=== 5. CURL LOCALHOST:6090/health ==="
          curl -ivs --max-time 5 http://localhost:6090/health || true
          
          echo "=== 6. CURL LOCALHOST:6090/api/v1/store/info ==="
          curl -ivs --max-time 5 http://localhost:6090/api/v1/store/info || true
          
          echo "=== 7. DOCKER COMPOSE CONFIG & ENV CHECK ==="
          if [ -f ".env" ]; then
            echo ".env exists. Configured variables:"
            grep -E '^[A-Z_]+=' .env | sed -E 's/=(.*)/=***/'
          else
            echo ".env does NOT exist in runner workspace."
          fi
