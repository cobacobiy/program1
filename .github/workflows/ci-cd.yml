name: CI/CD Pipeline — Program1 (Rust Modular Monolith)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]

jobs:
  # ============================================
  # Job 1: Validate (Check & Test Workspace)
  # ============================================
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        run: cargo check --workspace

      - name: Run Workspace Unit Tests
        run: cargo test --workspace

  # ============================================
  # Job 2: Build & Push Image to GHCR (ghcr.io)
  # ============================================
  build-ghcr:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (GitHub Container Registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/cobacobiy/program1:latest
            ghcr.io/cobacobiy/program1:${{ github.sha }}

  # ============================================
  # Job 3: Deploy Production (Server 226 Linux Runner)
  # ============================================
  deploy-production:
    needs: build-ghcr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, 226node2]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Container from GHCR (Linux Server 226)
        shell: bash
        run: |
          echo "Deploying Production Container from GHCR to Linux Server 226..."
          if [ ! -f ".env" ]; then
              cp .env.example .env
          fi
          docker pull ghcr.io/cobacobiy/program1:latest || true
          docker compose up -d --force-recreate --remove-orphans
          echo "Production GHCR deployment complete on Linux Server 226!"
