name: CI/CD Pipeline — Program1 (Rust Modular Monolith)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, closed]

jobs:
  # ============================================
  # Job 1: Validate (Check & Test Workspace)
  # ============================================
  validate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Check
        run: cargo check --workspace

      - name: Run Workspace Unit Tests
        run: cargo test --workspace

  # ============================================
  # Job 2: Deploy Production (Server 226 Linux Runner - Actionless Zero-Fetch)
  # ============================================
  deploy-production:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, 226node2]
    steps:
      - name: Deploy Production Container (Linux Server 226)
        shell: bash
        run: |
          echo "Deploying Production to Linux Server 226..."
          cd /home/gpu/actions-runner-program1/_work/program1/program1 || cd ./
          git fetch origin main || true
          git reset --hard origin/main || true
          if [ ! -f ".env" ]; then
              cp .env.example .env
          fi
          docker compose up -d --build --remove-orphans
          echo "Production deployment complete on Linux Server 226!"
